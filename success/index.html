<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Lease Document | LeaseDraft AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

  <header class="border-b bg-white py-4 px-6 mb-8 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <span class="text-xl font-bold text-blue-600">LeaseDraft AI</span>
      <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-full">Payment Confirmed</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4">
    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-md border border-slate-100">
      <div class="text-4xl mb-3">🎉</div>
      <h1 class="text-2xl font-bold text-slate-900 mb-2">Your Document is Ready</h1>
      <p class="text-slate-600 text-sm mb-6">Thank you for your purchase. You can copy your complete legal draft below or save it directly as a PDF.</p>

      <div id="printArea" class="bg-slate-50 p-6 rounded-lg border border-slate-200 text-sm font-mono whitespace-pre-wrap leading-relaxed min-h-[300px] mb-6 select-all">
        Loading document...
      </div>

      <button onclick="window.print()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow transition duration-150">
        Print / Save as Official PDF
      </button>
    </div>
  </main>

  <script>
    const fullNotice = localStorage.getItem('unlockedDocument');
    const displayBox = document.getElementById('printArea');

    if (fullNotice) {
      displayBox.innerText = fullNotice;
    } else {
      displayBox.innerText = "No document session found. Please return to the generator homepage to create your legal draft.";
    }
  </script>

</body>
</html>
